<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kâhya — panel</title>
<style>
  :root{
    --bg:#fbfaf7; --paper:#fff; --text:#171717; --muted:#6e6b65;
    --line:#e7e2d9; --soft:#f5f2ec; --accent:#d85f49; --accent-soft:#fff0eb;
    --ok:#2e7d4f; --ok-soft:#e8f5ee; --warn:#9a5b00; --warn-soft:#fff4e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;line-height:1.6}
  header{padding:24px 32px;background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:22px;letter-spacing:-.02em}
  header .sub{color:var(--muted);font-size:13px}
  .warn-banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid #ecd9b0;
    padding:10px 32px;font-size:14px}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;
    padding:8px 18px;font-size:14px;cursor:pointer;color:var(--muted)}
  .tab.active{background:var(--text);color:#fff;border-color:var(--text)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px 10px}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;
    padding:2px 10px;font-size:12px;background:var(--soft);color:#4a4742}
  .pill.over{background:#fdeaea;color:#b3261e;border-color:#f3c2c2}
  .pill.done{background:var(--ok-soft);color:var(--ok);border-color:#bfe3d0}
  .pill.api{background:var(--accent-soft);color:var(--accent);border-color:#f3c9bf}
  button{background:var(--text);color:#fff;border:none;border-radius:9px;padding:8px 16px;
    font-size:13px;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:5px 12px}
  button.ghost.red{color:#b3261e;border-color:#e0a3a0}
  button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}
  button.ok{background:var(--ok);color:#fff}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    font:inherit;background:#fff;margin-bottom:10px}
  textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
  .agent{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
  .agent .name{font-weight:600}
  .agent .slug{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .agent .actions{display:flex;gap:8px;flex-shrink:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat .n{font-size:28px;font-weight:700;letter-spacing:-.03em}
  .stat .l{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);font-size:14px;padding:14px 0}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:#fff;
    padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .login-wrap{max-width:380px;margin:80px auto;background:var(--paper);
    border:1px solid var(--line);border-radius:16px;padding:32px}
  .login-wrap h1{margin:0 0 6px;font-size:22px}
  .login-wrap .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .guide h3{margin:22px 0 6px;font-size:16px}
  .guide p{white-space:pre-line;font-size:14px;color:#333;margin:0 0 6px}
  .license p{white-space:pre-line;font-size:14px;color:#333}
  .settings-section{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .settings-section h3{margin:0 0 12px;font-size:15px}
  .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn-row .res{font-size:13px;color:var(--muted)}
  code{background:var(--soft);border-radius:5px;padding:1px 6px;font-size:12.5px}
  .model-pill{font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let T = {};            // translations (from /api/lang)
let SESSION = {authed:false, usingDefault:false};
let AMELES = [];       // amele list cache

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const t = k => { const v = k.split('.').reduce((o,p)=>o&&o[p], T); return (v!==undefined&&typeof v==='string') ? v : k; };
function tf(key, vars){ let s = t(key); Object.entries(vars||{}).forEach(([k,v])=> s=s.replace('{'+k+'}', v)); return s; }

async function api(path, opts={}){
  const res = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  if(res.status===401){ SESSION.authed=false; render(); throw new Error('unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function loadLang(){
  const lang = localStorage.getItem('kahya_lang') || 'tr';
  T = await api('/api/lang?lang='+lang);
  document.documentElement.lang = lang;
}

// ---------------------------------------------------------------- login
function renderLogin(){
  const warn = SESSION.usingDefault ? `<div class="warn-banner">⚠️ ${t('panel.login_default_warn')}</div>` : '';
  $('app').innerHTML = warn + `
  <div class="login-wrap">
    <h1>🧑‍💼 Kâhya</h1>
    <div class="sub">${t('panel.subtitle')}</div>
    <input id="li-user" placeholder="${t('panel.login_user')}" autocomplete="username" />
    <input id="li-pass" type="password" placeholder="${t('panel.login_pass')}" autocomplete="current-password" />
    <button style="width:100%" onclick="doLogin()">${t('panel.login_button')}</button>
    <div id="li-err" style="color:#b3261e;font-size:13px;margin-top:10px;min-height:18px"></div>
  </div>`;
  $('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  try{
    const r = await api('/api/login', {method:'POST', body:JSON.stringify({
      user:$('li-user').value, password:$('li-pass').value})});
    SESSION.authed = true;
    SESSION.usingDefault = (await api('/api/me')).using_default_password;
    render();
  }catch(e){ $('li-err').textContent = e.message==='locked' ? t('panel.login_locked') : t('panel.login_error'); }
}

// ---------------------------------------------------------------- layout
function renderHeader(){
  return `
  <header>
    <div>
      <h1>🧑‍💼 Kâhya <span style="color:var(--muted);font-weight:400">— ${t('panel.title').split('—')[1]||t('panel.title')}</span></h1>
      <div class="sub">${t('panel.subtitle')}</div>
    </div>
    <div class="btn-row">
      <select id="lang-sel" style="width:auto;margin:0" onchange="setLang(this.value)">
        <option value="tr" ${(localStorage.getItem('kahya_lang')||'tr')==='tr'?'selected':''}>Türkçe</option>
        <option value="en" ${(localStorage.getItem('kahya_lang')||'tr')==='en'?'selected':''}>English</option>
      </select>
      <button class="secondary" onclick="doLogout()">${t('panel.login_button')==='Giriş'?'Çıkış':'Logout'}</button>
    </div>
  </header>`;
}
async function doLogout(){ try{ await api('/api/logout',{method:'POST',body:'{}'}); }catch(_){} SESSION.authed=false; render(); }
function setLang(l){ localStorage.setItem('kahya_lang', l); loadLang().then(render); }

async function render(){
  await loadLang();
  if(!SESSION.authed){ renderLogin(); return; }
  const warn = SESSION.usingDefault ? `<div class="warn-banner">⚠️ ${t('panel.login_default_warn')}</div>` : '';
  const tabs = [
    ['overview', t('panel.tabs_overview')], ['ameleler', t('panel.tabs_ameleler')],
    ['kayitlar', t('panel.tabs_kayitlar')], ['onaylar', t('panel.tabs_onaylar')],
    ['mcp', t('panel.tabs_mcp')], ['settings', t('panel.tabs_settings')],
    ['guide', t('panel.tabs_guide')], ['license', t('panel.tabs_license')],
  ];
  $('app').innerHTML = warn + renderHeader() + `
  <main>
    <div class="tabs">
      ${tabs.map(([id,label],i)=>`<button class="tab ${i===0?'active':''}" data-tab="${id}">${label}</button>`).join('')}
    </div>
    ${tabs.map(([id])=>`<section id="tab-${id}" style="display:${id==='overview'?'':'none'}"></section>`).join('')}
    <footer style="color:var(--muted);font-size:13px;margin-top:40px;text-align:center">
      ${t('panel.footer')}
    </footer>
  </main>`;
  document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    tabs.forEach(([id])=> $('tab-'+id).style.display = id===tab.dataset.tab?'':'none');
    loadTab(tab.dataset.tab);
  });
  loadTab('overview');
}
function loadTab(id){
  if(id==='overview') loadOverview();
  if(id==='ameleler') loadAmeleler();
  if(id==='kayitlar') loadKayitlar();
  if(id==='onaylar') loadOnaylar();
  if(id==='mcp') loadMcp();
  if(id==='settings') loadSettings();
  if(id==='guide') renderGuide();
  if(id==='license') renderLicense();
}

// ---------------------------------------------------------------- overview
async function loadOverview(){
  try{
    const o = await api('/api/v2/overview');
    $('tab-overview').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${o.ameleler}</div><div class="l">${t('panel.overview_ameleler')}</div></div>
      <div class="stat"><div class="n">${o.kayitlar}</div><div class="l">${t('panel.overview_kayitlar')}</div></div>
      <div class="stat"><div class="n">${o.bekleyen_onaylar}</div><div class="l">${t('panel.overview_onaylar')}</div></div>
      <div class="stat"><div class="n">${o.bekleyen_gorevler}</div><div class="l">${t('panel.overview_gorevler')}</div></div>
    </div>
    <div class="card">
      <h2>${t('panel.overview_yaklasan')}</h2>
      ${o.yaklasan_gorevler.length ? `<table><thead><tr><th>${t('panel.kayit_amele')}</th><th>${t('panel.items_due')}</th><th></th></tr></thead>
        <tbody>${o.yaklasan_gorevler.map(g=>`
          <tr><td><b>${esc(g.amele_slug)}</b>${g.record_id? ` <span class="pill">#${g.record_id}</span>`:''}</td>
          <td><span class="pill ${g.gecikti?'over':'done'}">${esc(g.run_at)}${g.gecikti? ' — '+t('panel.overview_gecikti'):''}</span></td>
          <td><span class="pill">${g.attempts? g.attempts+'×':'✓'}</span></td></tr>`).join('')}
        </tbody></table>` : `<div class="empty">${t('panel.overview_yaklasan_empty')}</div>`}
    </div>`;
  }catch(e){ $('tab-overview').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- ameleler
function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,31); }
let slugAuto = true;

function modelPill(a){
  if(!a) return '';
  const kind = a.model_kind==='api' ? 'API' : 'local';
  return `<div class="model-pill"><span class="pill ${a.model_kind==='api'?'api':''}">${tf('panel.amele_model_pill',{kind,model:a.model_name||'—'})}</span>` +
    (a.schema_json? ` <span class="pill">⛃ şema</span>`:'') +
    (a.enabled? '' : ` <span class="pill over">off</span>`) + `</div>`;
}
function ameleRow(a, editing, confirming){
  const actions = editing ? `
      <button onclick="saveEditAmele(${a.id})">${t('panel.settings_save')}</button>
      <button class="secondary" onclick="loadAmeleler()">✕</button>`
    : confirming ? `
      <button class="ghost red" onclick="doDelAmele(${a.id})">${t('panel.agents_delete_yes')||'Delete'}</button>
      <button class="secondary" onclick="loadAmeleler()">${t('panel.agents_delete_no')||'Keep'}</button>`
    : `
      <button class="ghost" onclick="startEditAmele(${a.id})">${t('panel.amele_edit')}</button>
      <button class="ghost red" onclick="confirmDelAmele(${a.id})">${t('panel.amele_delete')}</button>`;
  const body = editing ? `
      <div class="grid2">
        <input id="ea-name" value="${esc(a.name)}" placeholder="${t('panel.amele_name')}" />
        <input value="${esc(a.slug)}" disabled style="background:var(--soft)" />
      </div>
      <textarea id="ea-desc" placeholder="${t('panel.amele_description')}" style="min-height:60px">${esc(a.description)}</textarea>
      <div class="grid3">
        <select id="ea-kind">
          <option value="local" ${a.model_kind!=='api'?'selected':''}>${t('panel.amele_model_kind_local')}</option>
          <option value="api" ${a.model_kind==='api'?'selected':''}>${t('panel.amele_model_kind_api')}</option>
        </select>
        <input id="ea-model" value="${esc(a.model_name||'')}" placeholder="${t('panel.amele_model_name')}" />
        <input id="ea-base" value="${esc((a.model_cfg&&a.model_cfg.base_url)||'')}" placeholder="${t('panel.amele_model_base')}" />
      </div>
      <textarea id="ea-schema" placeholder="${t('panel.amele_schema')}" style="min-height:70px">${esc(JSON.stringify(a.schema_json||{fields:[]},null,1))}</textarea>`
    : confirming ? `
      <div style="color:#b3261e;margin-bottom:8px">${t('panel.amele_delete_confirm')}</div>`
    : `
      <div class="name">${esc(a.name)}</div>
      <div class="slug">${esc(a.slug)}</div>
      ${modelPill(a)}
      <div class="yaml" style="color:var(--muted);font-size:12px;margin-top:6px">${esc(a.description||'').slice(0,160)}</div>`;
  return `<div class="agent" id="amele-${a.id}">
    <div style="flex:1">${body}</div>
    <div class="actions">${actions}</div>
  </div>`;
}
async function loadAmeleler(){
  try{
    const {ameleler} = await api('/api/v2/ameleler');
    AMELES = ameleler;
    $('tab-ameleler').innerHTML = `
    <div class="card">
      <h2>${t('panel.amele_new')}</h2>
      <p class="hint">${t('panel.amele_new_hint')}</p>
      <div class="grid2">
        <input id="na-name" placeholder="${t('panel.amele_name')}" oninput="naSlug()" />
        <input id="na-slug" placeholder="${t('panel.amele_slug')}" oninput="slugAuto=false" />
      </div>
      <textarea id="na-desc" placeholder="${t('panel.amele_description')}"></textarea>
      <div class="grid3">
        <select id="na-kind">
          <option value="local">${t('panel.amele_model_kind_local')}</option>
          <option value="api">${t('panel.amele_model_kind_api')}</option>
        </select>
        <input id="na-model" placeholder="${t('panel.amele_model_name')}" value="qwen3:27b" />
        <input id="na-base" placeholder="${t('panel.amele_model_base')}" />
      </div>
      <textarea id="na-schema" placeholder='${t('panel.amele_schema')}' style="min-height:80px"></textarea>
      <p class="hint" style="margin-bottom:8px">${t('panel.amele_schema_hint')}</p>
      <button onclick="addAmele()">${t('panel.amele_new')}</button>
    </div>
    <div class="card">
      <h2>${t('panel.tabs_ameleler')}</h2>
      <div id="ameleler-list">${ameleler.length ? ameleler.map(a=>ameleRow(a,false,false)).join('') : `<div class="empty">${t('panel.amele_empty')}</div>`}</div>
    </div>`;
  }catch(e){ $('tab-ameleler').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function naSlug(){ if(slugAuto) $('na-slug').value = slugify($('na-name').value); }
async function addAmele(){
  const name=$('na-name').value.trim(), desc=$('na-desc').value.trim();
  let slug=$('na-slug').value.trim().toLowerCase();
  if(!slug || slugAuto) slug = slugify(name);
  if(!name||!slug||!desc){ toast('!'); return; }
  let schema=null;
  if($('na-schema').value.trim()){ try{ schema=JSON.parse($('na-schema').value); }catch(e){ toast(t('panel.amele_schema_bad')); return; } }
  const model_kind=$('na-kind').value;
  const model_cfg = model_kind==='api' && $('na-base').value.trim() ? {base_url:$('na-base').value.trim()} : null;
  try{
    await api('/api/v2/ameleler',{method:'POST',body:JSON.stringify({
      name,slug,description:desc,model_kind,
      model_name:$('na-model').value.trim()||null, model_cfg, schema_json:schema})});
    toast(t('panel.amele_created'));
    ['na-name','na-slug','na-desc','na-model','na-base','na-schema'].forEach(id=>$(id).value='');
    slugAuto=true; loadAmeleler();
  }catch(e){ toast(e.message); }
}
function confirmDelAmele(id){ const row=$('amele-'+id); if(row && AMELES){
  const a=AMELES.find(x=>x.id===id); if(a) row.outerHTML=ameleRow(a,false,true); } }
function startEditAmele(id){ const row=$('amele-'+id); const a=AMELES.find(x=>x.id===id);
  if(row&&a) row.outerHTML=ameleRow(a,true,false); }
async function saveEditAmele(id){
  const a=AMELES.find(x=>x.id===id);
  let schema=null;
  if($('ea-schema').value.trim()){ try{ schema=JSON.parse($('ea-schema').value); }catch(e){ toast(t('panel.amele_schema_bad')); return; } }
  const model_kind=$('ea-kind').value;
  try{
    await api('/api/v2/ameleler/edit',{method:'POST',body:JSON.stringify({id,
      name:$('ea-name').value.trim(), description:$('ea-desc').value.trim(),
      model_kind, model_name:$('ea-model').value.trim()||null,
      model_cfg: model_kind==='api' && $('ea-base').value.trim() ? {base_url:$('ea-base').value.trim()} : null,
      schema_json: schema})});
    toast(t('panel.amele_saved')); loadAmeleler();
  }catch(e){ toast(e.message); }
}
async function doDelAmele(id){
  try{ await api('/api/v2/ameleler/delete',{method:'POST',body:JSON.stringify({id})});
    toast(t('panel.amele_deleted')); loadAmeleler(); }catch(e){ toast(e.message); }
}

// ---------------------------------------------------------------- kayitlar
let KAYIT_AMELE = null;
function schemaFields(a){
  if(!a || !a.schema_json || !a.schema_json.fields) return null;
  const disp = a.schema_json.fields.filter(f=>f.display);
  return disp.length ? disp : a.schema_json.fields.slice(0,5);
}
async function loadKayitlar(){
  try{
    const {ameleler} = await api('/api/v2/ameleler');
    if(!ameleler.length){ $('tab-kayitlar').innerHTML = `<div class="card"><h2>${t('panel.kayit_title')}</h2><div class="empty">${t('panel.amele_empty')}</div></div>`; return; }
    if(!KAYIT_AMELE || !ameleler.find(a=>a.id===KAYIT_AMELE)) KAYIT_AMELE = ameleler[0].id;
    const sel = ameleler.find(a=>a.id===KAYIT_AMELE);
    const q = (window.__KAYIT_Q||'');
    const {records} = await api('/api/v2/records?amele_id='+KAYIT_AMELE+(q?'&q='+encodeURIComponent(q):''));
    const fields = schemaFields(sel);
    const view = (window.__KAYIT_VIEW==='json' || !fields) ? 'json' : 'tablo';
    $('tab-kayitlar').innerHTML = `
    <div class="card">
      <h2>${t('panel.kayit_title')}</h2>
      <div class="grid2">
        <select id="kr-amele" onchange="KAYIT_AMELE=Number(this.value);loadKayitlar()">
          ${ameleler.map(a=>`<option value="${a.id}" ${a.id===KAYIT_AMELE?'selected':''}>${esc(a.name)} (${esc(a.slug)})</option>`).join('')}
        </select>
        <input id="kr-q" placeholder="${t('panel.kayit_ara')}" value="${esc(q)}"
               onkeydown="if(event.key==='Enter'){window.__KAYIT_Q=this.value;loadKayitlar();}" />
      </div>
      ${fields? `<div class="btn-row" style="margin-bottom:6px">
        <button class="secondary ${view==='tablo'?'active':''}" style="${view==='tablo'?'background:var(--text);color:#fff':''}" onclick="window.__KAYIT_VIEW='tablo';loadKayitlar()">${t('panel.kayit_tablo')}</button>
        <button class="secondary ${view==='json'?'active':''}" style="${view==='json'?'background:var(--text);color:#fff':''}" onclick="window.__KAYIT_VIEW='json';loadKayitlar()">${t('panel.kayit_json_görünüm')}</button>
      </div>`:''}
      <textarea id="kr-new" placeholder="${t('panel.kayit_json_ph')}" style="min-height:60px"></textarea>
      <button onclick="addKayit()">${t('panel.kayit_ekle')}</button>
    </div>
    <div class="card">
      <h2>${esc(sel.name)} — ${records.length}</h2>

async function addMcpServer(){
  const body = {
    name:$('ms-name').value.trim().toLowerCase(),
    kind:$('ms-kind').value,
    required:$('ms-required').checked,
  };
  if(body.kind==='http') body.url = $('ms-url').value.trim();
  else body.command = $('ms-command').value.trim();
  try{ body.headers = $('ms-headers').value.trim()? JSON.parse($('ms-headers').value):null; }catch(e){ toast(t('panel.amele_schema_bad')); return; }
  body.tools_include = $('ms-include').value.split(',').map(s=>s.trim()).filter(Boolean)||null;
  body.tools_exclude = $('ms-exclude').value.split(',').map(s=>s.trim()).filter(Boolean)||null;
  const client = $('ms-client').value.trim(), scopes = $('ms-scopes').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(client || scopes.length) body.auth = {type:'oauth', client_id:client||null, scopes:scopes.length?scopes:null};
  if(!body.name){ toast('!'); return; }
  try{ await api('/api/v2/mcp/servers',{method:'POST',body:JSON.stringify(body)});
    toast(t('panel.mcp_added')); loadMcp(); }catch(e){ toast(e.message); }
}
async function bindMcp(server_id){
  const amele_id = $('mb-'+server_id).value;
  try{ await api('/api/v2/mcp/bind',{method:'POST',body:JSON.stringify({server_id,amele_id})});
    toast(t('panel.mcp_bound_ok')); loadMcp(); }catch(e){ toast(e.message); }
}
async function unbindMcp(server_id){
  const s = (await api('/api/v2/mcp')).mcp_servers.find(x=>x.id===server_id);
  if(!s || !s.ameleler || !s.ameleler.length) return;
  const amele_id = $('mb-'+server_id).value;
  try{ await api('/api/v2/mcp/unbind',{method:'POST',body:JSON.stringify({server_id,amele_id})});
    toast(t('panel.mcp_unbound_ok')); loadMcp(); }catch(e){ toast(e.message); }
}
async function delMcp(id){
  if(!confirm(t('panel.amele_delete_confirm'))) return;
  try{ await api('/api/v2/mcp/servers/delete',{method:'POST',body:JSON.stringify({id})});
    toast(t('panel.mcp_deleted')); loadMcp(); }catch(e){ toast(e.message); }
}
async function mcpExplain(server_id){
  const amele_id = $('mb-'+server_id).value;
  const pre = $('mce-'+server_id);
  pre.style.display='block'; pre.textContent = t('panel.mcp_explain_running');
  try{
    const r = await api('/api/v2/mcp/explain',{method:'POST',body:JSON.stringify({server_id,amele_id})});
    pre.textContent = (r.ok? '' : '[exit '+r.exit+']\n') + r.output;
  }catch(e){ pre.textContent = e.message; }
}
async function mcpStatus(server_id){
  const el = $('mcs-'+server_id); el.textContent='…';
  try{ const r = await api('/api/v2/mcp/status');
    const row = (r.oauth_status||[]).find(x=>x.server===server_id);
    el.textContent = row? (row.ok?'✓':'✗')+' '+row.output.slice(0,300) : '—';
  }catch(e){ el.textContent = e.message; }
}
async function mcpLogin(server_id){
  const el = $('mcs-'+server_id); el.textContent='…';

    const r = await api('/api/v2/mcp/login',{method:'POST',body:JSON.stringify({server_id})});
    el.textContent = t('panel.mcp_login_cmd')+' '+r.command;
  }catch(e){ el.textContent = e.message; }
}
