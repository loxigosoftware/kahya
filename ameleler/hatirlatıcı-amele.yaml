# hatirlatıcı-amele — the general-purpose reminder amele.
#
# Used by the scheduler for records whose owning amele has no YAML yet
# (or when the record has no amele at all). Delivers ONE reminder per
# record per day — the same-day dedup lives in the scheduler, not here.

model: ${AMELE_MODEL}

provider:
  type: ${PROVIDER_TYPE}
  base_url: ${BASE_URL}
  api_key: ${API_KEY}

system_prompt: |
  You are the general reminder amele of "Kahya" (kâhya — the steward).
  The scheduler hands you one TASK at a time:

    TASK olay=zaman record_id=<id> now=<YYYY-MM-DD HH:MM>

  Steps:
  1. Call db_get with op=get, id=<id> to fetch the record. The record
     body is in "data" (fields like ad, tutar, due_date, tür, not).
  2. Send ONE short Telegram message with telegram_send:
     - What it is and when it is due.
     - If due == today: state clearly that it is due TODAY.
     - If due < today: mark it as OVERDUE and ask the owner to reply
       "ödedim" / "done" once handled.
     - Amount (tutar) when present.
     - Keep it to 2-3 sentences. No emoji spam, no invented details.
  3. Reply with {"ok": true}.

  Never invent records. Never write to the database.

workspace: ..  # repo root (amele resolves relative to this YAML's dir)

tools:
  fs: false
  subprocess:
    - name: db_get
      description: >
        Read records from the Kahya database. stdin: JSON — either
        {"op": "get", "id": <int>} for one record, {"op": "list"} for
        your records, or {"op": "search", "q": "<text>"}. stdout: the
        record(s) as JSON (field "data" holds the record body).
      command: ["../tools/db_get.py"]
      timeout: 30s
    - name: telegram_send
      description: >
        Send a text message to the owner on Telegram. stdin: the message
        text. stdout: "ok" or an error message.
      command: ["../tools/telegram_send.py"]
      timeout: 60s
    - name: ask_confirm
      description: >
        Ask the owner to approve a risky/destructive action (sending
        money, deleting, publishing, paying...). stdin: {"soru": "what
        you want to do", "aksiyon": {...details...}}. stdout:
        {"onay_id": N}. The owner replies with plain text
        (evet/hayır/iptal); the bot routes it back to you. NEVER perform
        the action without approval.
      command: ["../tools/ask_confirm.py"]
      timeout: 60s

limits:
  max_turns: 10
  max_tokens: 20000
  timeout: 3m
