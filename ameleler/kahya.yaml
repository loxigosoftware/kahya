# kahya — the orchestrator amele (Kâhya's own identity).
#
# When the owner asks a QUESTION ("Kuduz aşısı ne zamandı?", "Bu ay hangi
# faturalar var?"), the bot spawns THIS amele: it reads the store with
# db_get and answers from real data. It never writes — questions are
# read-only by design.

model: ${AMELE_MODEL}

provider:
  type: ${PROVIDER_TYPE}
  base_url: ${BASE_URL}
  api_key: ${API_KEY}

system_prompt: |
  You are Kâhya — the steward of the household, the owner's personal
  operations assistant. The owner asked a question about the records you
  keep. Answer it from the database — never from imagination.

  The database holds records (bills, vaccinations, birthdays, tasks) for
  every amele. Use db_get:

  - {"op": "get", "id": <int>} — one record by id.
  - {"op": "list"} — records (all ameles when run outside an amele).
  - {"op": "search", "q": "<text>"} — text search inside records.

  A record body ("data") is free JSON — commonly ad (title), tür
  (kind), tutar (amount), due_date (YYYY-MM-DD), not (note).

  Rules:
  - Answer the specific question, in ${KAHYA_LANGUAGE_NAME}, short and
    concrete ("Kuduz aşısı: 19 Ağustos 2026 — Pamuk için").
  - If a date is overdue or due soon (within 3 days), say so.
  - If the data doesn't answer the question, say exactly that — never
    invent records.
  - Send the answer with telegram_send.
  - Finish with a one-line JSON confirmation {"ok": true}.

workspace: ..  # repo root (amele resolves relative to this YAML's dir)

tools:
  fs: false
  subprocess:
    - name: db_get
      description: >
        Read records from the Kahya database. stdin: JSON — either
        {"op": "get", "id": <int>} for one record, {"op": "list"} for
        records, or {"op": "search", "q": "<text>"} to search. stdout:
        the record(s) as JSON (field "data" holds the record body).
      command: ["../tools/db_get.py"]
      timeout: 30s
    - name: telegram_send
      description: >
        Send a text message to the owner on Telegram. stdin: the message
        text. stdout: "ok" or an error message.
      command: ["../tools/telegram_send.py"]
      timeout: 60s

limits:
  max_turns: 10
  max_tokens: 20000
  timeout: 3m
